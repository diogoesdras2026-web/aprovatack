<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Caderno de Erros - AprovaTrack</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f9fc;
            color: #172033;
        }

        header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #2563eb;
        }

        .back {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .box {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d7dce5;
            border-radius: 9px;
            font-size: 15px;
            background: white;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px 22px;
            border-radius: 9px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.92;
        }

        .message {
            display: none;
            padding: 14px;
            border-radius: 9px;
            margin-top: 18px;
        }

        .message.success {
            display: block;
            background: #ecfdf5;
            color: #166534;
        }

        .message.error {
            display: block;
            background: #fef2f2;
            color: #991b1b;
        }

        .review {
            padding: 16px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .review:last-child {
            border-bottom: none;
        }

        .review-title {
            font-weight: bold;
        }

        .review-detail {
            color: #64748b;
            margin-top: 5px;
        }

        .empty {
            color: #64748b;
            padding: 15px 0;
        }

        @media (max-width: 700px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>


<body>

<header>

    <div class="logo">
        Aprova<span>Track</span>
    </div>

    <a
        class="back"
        href="/"
    >
        ← Dashboard
    </a>

</header>


<main>

    <h1>🧠 Caderno de Erros</h1>

    <p class="subtitle">
        Registre aquilo que você errou durante seus estudos.
        O AprovaTrack criará automaticamente revisões para
        1, 7 e 30 dias.
    </p>


    <section class="box">

        <div class="form-group">

            <label>
                Concurso *
            </label>

            <select id="examSelect">

                <option value="">
                    Carregando concursos...
                </option>

            </select>

        </div>

    </section>


    <section class="box">

        <h2>🔴 Registrar erro</h2>

        <form id="errorForm">

            <div class="grid">

                <div class="form-group">

                    <label>
                        Disciplina *
                    </label>

                    <select
                        id="subjectSelect"
                        required
                    >

                        <option value="">
                            Selecione um concurso
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Assunto
                    </label>

                    <select id="topicSelect">

                        <option value="">
                            Selecione uma disciplina
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Tipo de erro
                    </label>

                    <select id="errorType">

                        <option value="conceitual">
                            Confusão conceitual
                        </option>

                        <option value="interpretacao">
                            Erro de interpretação
                        </option>

                        <option value="distracao">
                            Falta de atenção
                        </option>

                        <option value="memorizacao">
                            Falha de memorização
                        </option>

                        <option value="calculo">
                            Erro de cálculo
                        </option>

                        <option value="desconhecimento">
                            Conteúdo desconhecido
                        </option>

                        <option value="outro">
                            Outro
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-group">

                <label>
                    O que você errou? *
                </label>

                <textarea
                    id="description"
                    required
                    placeholder="Ex.: Confundi suspensão com exclusão do crédito tributário."
                ></textarea>

            </div>


            <button type="submit">
                💾 Salvar erro e criar revisões
            </button>


            <div
                id="errorMessage"
                class="message"
            ></div>

        </form>

    </section>


    <section class="box">

        <h2>📅 Revisões de hoje</h2>

        <div id="todayReviews">

            <div class="empty">
                Carregando revisões...
            </div>

        </div>

    </section>

</main>


<script src="/erros.js"></script>

</body>

</html>
